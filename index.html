    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --jarvis-primary: #00f0ff;
        --jarvis-primary-rgb: 0, 240, 255;
        --jarvis-secondary: #0284c7;
        --jarvis-secondary-rgb: 2, 132, 199;
        --jarvis-bg-dark: #040711;
        --jarvis-bg-dark-rgb: 4, 7, 17;
        --jarvis-blur: 24px;
        --jarvis-glass-opacity: 0.82;
        --jarvis-glass-bg: rgba(4, 7, 17, 0.82);
        --jarvis-glass-highlight: rgba(0, 240, 255, 0.08);
        --jarvis-border: rgba(0, 240, 255, 0.22);
        --jarvis-border-glow: rgba(0, 240, 255, 0.85);
        --jarvis-glow: 0 0 24px -2px rgba(0, 240, 255, 0.5);
        --jarvis-glow-lg: 0 0 45px -4px rgba(0, 240, 255, 0.65);
      }

      body { 
        font-family: 'Inter', sans-serif; 
        background-color: var(--jarvis-bg-dark, #040711);
        transition: background-color 0.4s ease;
      }
      h1, h2, h3, h4, h5, h6, .font-heading { font-family: 'Space Grotesk', 'Inter', sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }
      
      /* Dynamic JARVIS Cyber Grid Background */
      .bg-grid-pattern {
        background-color: var(--jarvis-bg-dark, #040711);
        background-image: 
          radial-gradient(circle at 50% 0%, rgba(var(--jarvis-primary-rgb), 0.12) 0%, transparent 60%),
          linear-gradient(rgba(var(--jarvis-primary-rgb), 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(var(--jarvis-primary-rgb), 0.035) 1px, transparent 1px);
        background-size: 100% 100%, 36px 36px, 36px 36px;
      }
      
      /* Liquid Glass Base */
      .glass-panel, .liquid-glass {
        background: var(--jarvis-glass-bg, rgba(6, 9, 18, 0.82));
        backdrop-filter: blur(var(--jarvis-blur, 24px)) saturate(160%);
        -webkit-backdrop-filter: blur(var(--jarvis-blur, 24px)) saturate(160%);
        border: 1px solid var(--jarvis-border, rgba(0, 240, 255, 0.2));
        box-shadow: 
          inset 0 1px 1px 0 rgba(255, 255, 255, 0.14),
          inset 0 -1px 1px 0 rgba(0, 0, 0, 0.4),
          0 12px 36px 0 rgba(0, 0, 0, 0.5);
      }

      .liquid-glass-card {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.04) 0%, rgba(var(--jarvis-primary-rgb), 0.02) 100%), var(--jarvis-glass-bg);
        backdrop-filter: blur(var(--jarvis-blur, 24px));
        -webkit-backdrop-filter: blur(var(--jarvis-blur, 24px));
        border: 1px solid var(--jarvis-border, rgba(0, 240, 255, 0.2));
        box-shadow: 
          inset 0 1px 1px 0 rgba(255, 255, 255, 0.12),
          0 10px 30px -5px rgba(0, 0, 0, 0.6);
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .liquid-glass-card:hover {
        border-color: rgba(var(--jarvis-primary-rgb), 0.45);
        box-shadow: 
          inset 0 1px 2px 0 rgba(255, 255, 255, 0.2),
          0 0 25px -4px rgba(var(--jarvis-primary-rgb), 0.3),
          0 15px 40px -5px rgba(0, 0, 0, 0.7);
        transform: translateY(-2px);
      }

      /* Liquid Glass Buttons */
      .jarvis-btn-primary {
        background: linear-gradient(135deg, var(--jarvis-primary) 0%, var(--jarvis-secondary) 100%);
        color: #000000;
        font-weight: 900;
        letter-spacing: 0.05em;
        position: relative;
        overflow: hidden;
        box-shadow: 
          inset 0 1px 1px 0 rgba(255, 255, 255, 0.4),
          0 0 20px -2px rgba(var(--jarvis-primary-rgb), 0.6);
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .jarvis-btn-primary:hover {
        filter: brightness(1.1);
        box-shadow: 
          inset 0 1px 2px 0 rgba(255, 255, 255, 0.6),
          0 0 32px 0px rgba(var(--jarvis-primary-rgb), 0.85);
        transform: translateY(-1px) scale(1.02);
      }

      .jarvis-btn-primary:active {
        transform: translateY(1px) scale(0.98);
      }

      .jarvis-btn-secondary {
        background: rgba(var(--jarvis-primary-rgb), 0.08);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--jarvis-border, rgba(0, 240, 255, 0.3));
        color: #ffffff;
        box-shadow: inset 0 1px 1px 0 rgba(255, 255, 255, 0.1);
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .jarvis-btn-secondary:hover {
        background: rgba(var(--jarvis-primary-rgb), 0.16);
        border-color: var(--jarvis-primary);
        box-shadow: 
          inset 0 1px 2px 0 rgba(255, 255, 255, 0.2),
          0 0 20px -4px rgba(var(--jarvis-primary-rgb), 0.5);
        transform: translateY(-1px);
      }

      /* Holographic text glow */
      .hud-glow-text {
        text-shadow: 0 0 12px rgba(var(--jarvis-primary-rgb), 0.7);
      }

      /* HUD Corner brackets */
      .hud-frame {
        position: relative;
      }
      .hud-frame::before {
        content: '';
        position: absolute;
        top: -1px;
        left: -1px;
        width: 10px;
        height: 10px;
        border-top: 2px solid var(--jarvis-primary);
        border-left: 2px solid var(--jarvis-primary);
        pointer-events: none;
      }
      .hud-frame::after {
        content: '';
        position: absolute;
        bottom: -1px;
        right: -1px;
        width: 10px;
        height: 10px;
        border-bottom: 2px solid var(--jarvis-primary);
        border-right: 2px solid var(--jarvis-primary);
        pointer-events: none;
      }

      /* Liquid Orb Drift Animations */
      @keyframes float-orb-1 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(80px, 40px) scale(1.15); }
      }
      @keyframes float-orb-2 {
        0%, 100% { transform: translate(0, 0) scale(1.1); }
        50% { transform: translate(-60px, -50px) scale(0.9); }
      }
      @keyframes float-orb-3 {
        0%, 100% { transform: translate(0, 0) scale(0.95); }
        50% { transform: translate(40px, -60px) scale(1.08); }
      }
      .animate-orb-1 { animation: float-orb-1 18s ease-in-out infinite; }
      .animate-orb-2 { animation: float-orb-2 22s ease-in-out infinite; }
      .animate-orb-3 { animation: float-orb-3 26s ease-in-out infinite; }

      /* Scanning line */
      @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(1000%); }
      }
      .jarvis-scanline {
        background: linear-gradient(to bottom, transparent, rgba(var(--jarvis-primary-rgb), 0.15), transparent);
        animation: scanline 8s linear infinite;
        pointer-events: none;
      }

      /* Universal Dynamic JARVIS Liquid Glass Theme Overrides */
      /* These rules guarantee 100% theme propagation across EVERY page, card, modal, and table in the app */
      .bg-\[\#0a0b0e\],
      .bg-\[\#090a0d\],
      .bg-\[\#0b0c10\],
      .bg-\[\#0b0c0f\],
      .bg-\[\#0e0f14\],
      .bg-\[\#0e1017\],
      .bg-\[\#10121a\],
      .bg-\[\#101217\],
      .bg-\[\#08090c\],
      .bg-\[\#07080a\],
      .bg-\[\#05070a\],
      .bg-\[\#05070e\],
      .bg-\[\#060709\] {
        background: var(--jarvis-glass-bg, rgba(4, 7, 17, 0.85)) !important;
        backdrop-filter: blur(var(--jarvis-blur, 24px)) saturate(160%);
        -webkit-backdrop-filter: blur(var(--jarvis-blur, 24px)) saturate(160%);
        border-color: var(--jarvis-border, rgba(0, 240, 255, 0.2)) !important;
      }

      .bg-\[\#12141a\],
      .bg-\[\#14151c\],
      .bg-\[\#14161f\],
      .bg-\[\#141624\],
      .bg-\[\#181a24\],
      .bg-\[\#181a22\],
      .bg-\[\#161822\] {
        background-color: rgba(var(--jarvis-primary-rgb), 0.08) !important;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-color: var(--jarvis-border, rgba(0, 240, 255, 0.2)) !important;
      }

      .border-neutral-800,
      .border-neutral-800\/80,
      .border-neutral-800\/60,
      .border-neutral-800\/50,
      .border-neutral-900 {
        border-color: var(--jarvis-border, rgba(0, 240, 255, 0.22)) !important;
      }

      .border-neutral-700,
      .border-neutral-700\/80,
      .border-neutral-700\/60 {
        border-color: rgba(var(--jarvis-primary-rgb), 0.38) !important;
      }

      /* Dynamic focus borders and glow for text inputs & selectors */
      input:focus, select:focus, textarea:focus {
        border-color: var(--jarvis-primary) !important;
        box-shadow: 0 0 15px -2px rgba(var(--jarvis-primary-rgb), 0.4) !important;
      }

      /* Dynamic hover for table rows */
      tbody tr:hover {
        background-color: rgba(var(--jarvis-primary-rgb), 0.06) !important;
      }

      /* Dynamic table head tint */
      thead {
        background-color: rgba(var(--jarvis-primary-rgb), 0.08) !important;
        border-bottom: 1px solid var(--jarvis-border) !important;
      }

      /* Dark Smooth Scrollbar with theme tint */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--jarvis-bg-dark, #040711);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(var(--jarvis-primary-rgb), 0.28);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--jarvis-primary);
      }
    </style>
